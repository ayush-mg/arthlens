[pytest]
minversion = 8.0
testpaths = backend/tests
pythonpath = . backend
addopts = -ra -q --strict-markers
markers =
    smoke: baseline environment and configuration smoke tests
    property: property-based tests (Hypothesis)
    unit: deterministic unit invariant and spec tests
    contract: interface contract tests
    integration: PostgreSQL and container integration tests
    ledger_invariant: red-stage ledger invariant tests awaiting P1-3
