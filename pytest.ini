[pytest]
minversion = 8.0
testpaths = backend/tests
pythonpath = . backend
addopts = -ra -q --strict-markers
markers =
    smoke: baseline environment and configuration smoke tests
    property: property-based tests (Hypothesis)
    unit: deterministic unit invariant and spec tests
    contract: interface contract tests
    integration: PostgreSQL and container integration tests
    business: business operating system and domain tests
    decision: decision intelligence and simulation tests
    live: optional tests requiring live external network access
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:httpx.*
