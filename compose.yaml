# ArthLens Full Stack Docker Compose Specification
# Authoritative Reference: ArthLens Build Handbook v1.0 & Master Build Plan Phase 1
services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: arthlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arthlens}
      POSTGRES_USER: ${POSTGRES_USER:-arthlens_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arthlens_dev_password}
    ports:
      # Bind exclusively to localhost to prevent public network exposure
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arthlens_dev} -d ${POSTGRES_DB:-arthlens}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: arthlens-migrate
    command: alembic -c /app/backend/alembic.ini upgrade head
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-arthlens}
      POSTGRES_USER: ${POSTGRES_USER:-arthlens_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arthlens_dev_password}
      DATABASE_URL: postgresql://${POSTGRES_USER:-arthlens_dev}:${POSTGRES_PASSWORD:-arthlens_dev_password}@db:5432/${POSTGRES_DB:-arthlens}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: arthlens-seed
    command: python /app/scripts/seed_demo_accounts.py
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-arthlens}
      POSTGRES_USER: ${POSTGRES_USER:-arthlens_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arthlens_dev_password}
      DATABASE_URL: postgresql://${POSTGRES_USER:-arthlens_dev}:${POSTGRES_PASSWORD:-arthlens_dev_password}@db:5432/${POSTGRES_DB:-arthlens}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: arthlens-backend
    command: uvicorn backend.arthlens.api.app:create_app --factory --host 0.0.0.0 --port 8000
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-arthlens}
      POSTGRES_USER: ${POSTGRES_USER:-arthlens_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arthlens_dev_password}
      DATABASE_URL: postgresql://${POSTGRES_USER:-arthlens_dev}:${POSTGRES_PASSWORD:-arthlens_dev_password}@db:5432/${POSTGRES_DB:-arthlens}
      SECRET_KEY: ${SECRET_KEY:-local-insecure-dev-secret-key-32-chars-min!}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/auth/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: arthlens-worker
    command: python /app/scripts/run_agent_worker.py --poll-interval 1.0
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-arthlens}
      POSTGRES_USER: ${POSTGRES_USER:-arthlens_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arthlens_dev_password}
      DATABASE_URL: postgresql://${POSTGRES_USER:-arthlens_dev}:${POSTGRES_PASSWORD:-arthlens_dev_password}@db:5432/${POSTGRES_DB:-arthlens}
      SECRET_KEY: ${SECRET_KEY:-local-insecure-dev-secret-key-32-chars-min!}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arthlens-frontend
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-8000}
      PORT: "3000"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: arthlens_postgres_data
