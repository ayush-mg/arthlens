[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arthlens-backend"
version = "0.1.0"
description = "ArthLens: Evidence-gated economic decision engine for Indian micro-enterprises"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "geoalchemy2>=0.14.4",
    "psycopg[binary]>=3.1.18",
    "numpy>=1.26.4",
    "scipy>=1.13.0",
    "pandas>=2.2.1",
    "geopandas>=0.14.3",
    "shapely>=2.0.3",
    "pint>=0.23",
    "networkx>=3.2.1",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8.0",
    "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "hypothesis>=6.100.0",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
pythonpath = ["..", "."]
addopts = "-ra -q --strict-markers"
markers = [
    "smoke: baseline environment and configuration smoke tests",
    "property: property-based tests (Hypothesis)",
    "unit: deterministic unit invariant and spec tests",
    "contract: interface contract tests",
    "integration: PostgreSQL and container integration tests",
    "ledger_invariant: red-stage ledger invariant tests awaiting P1-3",
]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:httpx.*",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
