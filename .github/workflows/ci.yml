name: ArthLens CI

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Python 3.14 + PostGIS 16-3.4)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://arthlens_test:arthlens_test_password@localhost:5432/arthlens_test
      POSTGRES_PORT: 5432
      LLM_PROVIDER: deterministic

    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: arthlens_test
          POSTGRES_USER: arthlens_test
          POSTGRES_PASSWORD: arthlens_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14 (Project Specification)
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install system dependencies (PostgreSQL client & Geospatial libraries)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            postgresql-client \
            libpq-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./backend[dev]

      - name: Verify PostgreSQL 16 + PostGIS 3.4 connectivity and extension
        env:
          PGPASSWORD: arthlens_test_password
        run: |
          echo "Checking PostgreSQL connection and PostGIS extension..."
          psql -h localhost -U arthlens_test -d arthlens_test -c "CREATE EXTENSION IF NOT EXISTS postgis;"
          psql -h localhost -U arthlens_test -d arthlens_test -c "SELECT PostGIS_Version();"

      - name: "Apply Alembic Migrations to PostgreSQL (P1-5 Acceptance: Part 9 Schema)"
        env:
          DATABASE_URL: postgresql+psycopg://arthlens_test:arthlens_test_password@localhost:5432/arthlens_test
        run: |
          cd backend
          python -m alembic upgrade head

      - name: "Run Baseline Smoke Tests"
        run: |
          pytest backend/tests/smoke/ -v

      - name: "Run Domain & Interface Contract Tests"
        env:
          DATABASE_URL: postgresql+psycopg://arthlens_test:arthlens_test_password@localhost:5432/arthlens_test
        run: |
          pytest backend/tests/contract/ -v

      - name: "Run Epistemic Ledger Invariant & Unit Tests"
        run: |
          pytest backend/tests/property/ backend/tests/unit/ -v

      - name: "Run PostgreSQL + PostGIS Integration Tests"
        env:
          DATABASE_URL: postgresql+psycopg://arthlens_test:arthlens_test_password@localhost:5432/arthlens_test
        run: |
          pytest backend/tests/integration/ -v

  frontend-ci:
    name: Frontend CI (Node 20 + Vitest + Next.js Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Vitest Unit & Component Tests
        run: |
          cd frontend
          npm test -- --run

      - name: Build Next.js Production Bundle
        run: |
          cd frontend
          npm run build
